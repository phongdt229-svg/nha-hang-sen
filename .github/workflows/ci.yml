name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nhs
          POSTGRES_PASSWORD: nhs
          POSTGRES_DB: nhs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nhs" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      # Test mBot v1 đầu–cuối (API ↔ MQTT ↔ robot bridge ↔ mBot ảo). Bản 1.6 cho phép kết nối ẩn danh mặc định.
      mqtt:
        image: eclipse-mosquitto:1.6
        ports: ['1883:1883']
    env:
      DATABASE_URL: postgresql://nhs:nhs@localhost:5432/nhs?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
