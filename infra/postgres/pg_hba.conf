# Kết nối cục bộ trong container (healthcheck, psql khi xử lý sự cố).
local   all           all                     trust
# API, công cụ quản trị trong LAN: bắt buộc mật khẩu.
host    all           all           all       scram-sha-256
# Sao lưu nền (pg_basebackup từ dịch vụ backup) cần quyền replication.
host    replication   all           all       scram-sha-256
