server {
  listen 80;
  root /usr/share/nginx/html;

  location = / { return 302 /pos/; }

  # Mỗi app là một SPA riêng dưới base path của nó.
  location /tablet/ { try_files $uri $uri/ /tablet/index.html; }
  location /pos/    { try_files $uri $uri/ /pos/index.html; }
  location /kds/    { try_files $uri $uri/ /kds/index.html; }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
